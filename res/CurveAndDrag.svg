  <circle cx="222" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="245" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="268" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>

