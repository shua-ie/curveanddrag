  <circle cx="48" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="70" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="92" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="118" cy="320" r="1.5" fill="#222" stroke="#444" stroke-width="0.5"/>

