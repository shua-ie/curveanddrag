  <circle cx="818" cy="22" r="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <circle cx="818" cy="22" r="2.5" fill="#111" stroke="#444" stroke-width="0.5"/>
  <circle cx="22" cy="358" r="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <circle cx="22" cy="358" r="2.5" fill="#111" stroke="#444" stroke-width="0.5"/>
  <circle cx="818" cy="358" r="6" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
