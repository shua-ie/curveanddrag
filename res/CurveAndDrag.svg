  <line x1="420" y1="0" x2="420" y2="380" stroke="#444" stroke-width="0.5"/>
  <line x1="560" y1="0" x2="560" y2="380" stroke="#444" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="380" stroke="#444" stroke-width="0.5"/>

