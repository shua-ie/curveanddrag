<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="284.48mm" height="128.5mm" viewBox="0 0 840 380">
  <!-- CurveAndDrag v1.0 - 56HP Panel - NanoSVG compatible (no text elements) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
